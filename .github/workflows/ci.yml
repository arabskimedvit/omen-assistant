name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (the camera library is not needed for the tests)
        run: pip install fastapi uvicorn ollama ddgs python-docx httpx pytest
      - name: Run tests
        run: python -m pytest -q
